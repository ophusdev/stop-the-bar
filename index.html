<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A silly one-button timing game for short breaks." />
    <meta name="theme-color" content="#14161b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <title>Stop The Bar</title>
  </head>
  <body>
    <header>
      <h1>Stop The Bar</h1>
      <div class="header-actions">
        <button type="button" id="mute">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9h4l5-4v14l-5-4H4z" />
            <path class="waves" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" />
            <path class="slash" d="M16 9l6 6M22 9l-6 6" />
          </svg>
          <span id="mute-label">Sound on</span>
        </button>
        <button type="button" id="reset">Reset stats</button>
      </div>
    </header>
    <main id="play">
      <p class="streak"><span id="streak">0</span> streak</p>
      <div id="bar">
        <div id="zone"></div>
        <div id="needle"></div>
      </div>
      <div id="feedback" aria-live="polite">
        <p id="result"></p>
        <p id="quip"></p>
      </div>
      <p class="hint">
        <span class="hint-touch">Tap</span>
        <span class="hint-desktop">Click or press <kbd>Space</kbd></span>
        when the needle is in the zone
      </p>
      <p class="stats">
        <span>Best <b id="best">0</b></span>
        <span>Hits <b id="hits">0</b></span>
        <span>Perfects <b id="perfects">0</b></span>
        <span>Accuracy <b id="accuracy">–</b></span>
      </p>
    </main>
    <dialog aria-labelledby="reset-title">
      <form method="dialog">
        <h2 id="reset-title">Reset stats?</h2>
        <p>Best streak, hits and accuracy all go back to zero. There is no undo.</p>
        <div class="actions">
          <button type="submit" autofocus>Keep them</button>
          <button type="submit" id="confirm-reset" class="danger">Reset</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
