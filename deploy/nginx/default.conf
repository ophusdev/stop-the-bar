server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # behind the host's reverse proxy: never build redirects from our own port
    absolute_redirect off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml;

    # add_header in a location drops every add_header inherited from server,
    # so the security headers are included in each location instead.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # File names carry a content hash, so they never change. No "always":
    # a 404 here must not be cached for a year.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        return 204;
    }
}
